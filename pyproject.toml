[project]
name = "papaya"
version = "0.1.0"
description = "AI-powered farming assistant for sustainable agriculture"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    # Web Framework
    "fastapi>=0.110.0",
    "granian>=0.7.0",
    "uvicorn[standard]>=0.27.0",
    "python-multipart>=0.0.9",
    
    # LLM
    "google-generativeai>=0.4.0",
    
    # Database
    "sqlmodel>=0.0.16",
    "aiosqlite>=0.20.0",
    
    # HTTP Client
    "httpx>=0.26.0",
    
    # Config
    "pydantic-settings>=2.1.0",
    "python-dotenv>=1.0.0",
    
    # PDF Generation
    "reportlab>=4.0.0",
    
    # Templates
    "jinja2>=3.1.0",
    
    # Utilities
    "tenacity>=8.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["app"]

[project.scripts]
papaya = "app.main:main"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
select = ["E", "F", "I", "N", "W", "UP"]
ignore = ["E501"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "pytest-asyncio>=1.3.0",
]
