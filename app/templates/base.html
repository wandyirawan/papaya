<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Papaya AI{% endblock %}</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@picocss/pico@2/css/pico.min.css">
    <link rel="stylesheet" href="/static/style.css">
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    {% block head %}{% endblock %}
</head>
<body>
    <nav class="container-fluid">
        <ul>
            <li><strong class="papaya-brand">🍉 Papaya AI</strong></li>
        </ul>
        <ul>
            <li><a href="/">Home</a></li>
            <li><a href="/api/v1/docs">API Docs</a></li>
            <li><a href="https://rize.farm" target="_blank">Rize Farm</a></li>
        </ul>
    </nav>

    <main class="container">
        {% block content %}{% endblock %}
    </main>

    <footer class="container">
        <small>
            Built with ❤️ for Rize Farm • 
            <a href="https://rize.farm" target="_blank">rize.farm</a>
        </small>
    </footer>

    {% block scripts %}{% endblock %}
</body>
</html>
